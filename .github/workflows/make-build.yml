name: Verify and build main branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run unit and integration tests
        run: make test

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            binary: target/release/mud-client
            standalone: mud-client-linux-x86_64
            archive: mud-client-linux-x86_64.zip
          - platform: macos-arm64
            runner: macos-15
            binary: target/release/mud-client
            standalone: mud-client-macos-arm64
            archive: mud-client-macos-arm64.zip
          - platform: windows-x86_64
            runner: windows-latest
            binary: target/release/mud-client.exe
            standalone: mud-client-windows-x86_64.exe
            archive: mud-client-windows-x86_64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release executable
        run: cargo build --release --locked
      - name: Stage standalone executable and runtime bundle
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          STANDALONE: ${{ matrix.standalone }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          package_root="dist/mud-client-${{ matrix.platform }}"
          mkdir -p "$package_root/docs" "$package_root/install" "$package_root/scripts"
          cp "$BINARY" "dist/$STANDALONE"
          cp "$BINARY" "$package_root/"
          cp README.md LICENSE config.toml rots.toml "$package_root/"
          cp install/default-config.toml "$package_root/install/"
          cp -R scripts/. "$package_root/scripts/"
          cp -R docs/. "$package_root/docs/"
          for installer in install.sh install.ps1 Install-Windows.cmd Install-macOS.command; do
            if [[ -f "$installer" ]]; then
              cp "$installer" "$package_root/"
            fi
          done
          (
            cd dist
            if command -v zip >/dev/null 2>&1; then
              zip -qr "$ARCHIVE" "mud-client-${{ matrix.platform }}"
            else
              7z a -tzip "$ARCHIVE" "mud-client-${{ matrix.platform }}"
            fi
          )
      - name: Stage standalone executable artifact
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          rm -rf standalone-artifact
          mkdir -p standalone-artifact
          cp "$BINARY" standalone-artifact/
          test "$(find standalone-artifact -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Upload standalone executable
        uses: actions/upload-artifact@v7
        with:
          name: mud-client-${{ matrix.platform }}-executable
          path: standalone-artifact/*
          if-no-files-found: error
      - name: Upload runtime ZIP bundle
        uses: actions/upload-artifact@v7
        with:
          name: mud-client-${{ matrix.platform }}-bundle
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Tag and publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -z "$latest" ]]; then
            major=0
            minor=1
            patch=0
          elif [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Latest tag is not a semantic version: $latest" >&2
            exit 1
          fi
          while true; do
            next="v${major}.${minor}.${patch}"
            if ! git rev-parse "$next" >/dev/null 2>&1; then
              echo "Selected release tag: $next"
              echo "tag=$next" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Tag already exists: $next; trying the next patch version"
            patch=$((patch + 1))
          done

      - name: Download Linux executable
        uses: actions/download-artifact@v8
        with:
          name: mud-client-linux-x86_64-executable
          path: release-assets/linux

      - name: Download macOS executable
        uses: actions/download-artifact@v8
        with:
          name: mud-client-macos-arm64-executable
          path: release-assets/macos

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: mud-client-windows-x86_64-executable
          path: release-assets/windows

      - name: Select release deliverables
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets-flat
          mkdir -p release-assets-flat
          find release-assets -type f -print
          mapfile -t linux_binaries < <(find release-assets/linux -maxdepth 1 -type f -name 'mud-client')
          mapfile -t macos_binaries < <(find release-assets/macos -maxdepth 1 -type f -name 'mud-client')
          mapfile -t windows_binaries < <(find release-assets/windows -maxdepth 1 -type f -name 'mud-client.exe')
          test "${#linux_binaries[@]}" -eq 1
          test "${#macos_binaries[@]}" -eq 1
          test "${#windows_binaries[@]}" -eq 1
          cp "${linux_binaries[0]}" release-assets-flat/mud-client-linux-x86_64
          cp "${macos_binaries[0]}" release-assets-flat/mud-client-macos-arm64
          cp "${windows_binaries[0]}" release-assets-flat/mud-client-windows-x86_64.exe
          test "$(find release-assets-flat -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Create and push version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: release-assets-flat/*
