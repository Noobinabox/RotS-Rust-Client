# Safe first-run settings. Other options use built-in defaults.
# See docs/configuration.md before enabling example automation.
[connection]
host = "rotsmud.org"
port = 3791
username = ""
password = ""

[terminal]
input_mode = "standard"

[lua]
enabled = false

# Command history stays in memory unless persistence is enabled.
[history]
persist = false
max_entries = 1000
ignore_prefixes = ["password ", "passwd "]
