group_member_name = "NAME"
group_member_health = "HEALTH"
group_member_mana = "MANA"
group_member_movement = "MOVEMENT"

[variables]
max_expansion_depth = 8
max_expanded_bytes = 65536

[variables.values]
# target = "orc"

[aliases]
enabled = true
max_expansion_depth = 8
max_expanded_commands = 256

[[aliases.rules]]
name = "Regeneration and Vit"
match_type = "exact"
pattern = "rr"
commands = ["cast regen", "cast vit"]

# Example Lua alias hooks from scripts/init.lua:
[[aliases.rules]]
name = "smart-kill"
match_type = "regex"
pattern = "^sk\\s+(.+)$"
lua = "smart_kill"

[[aliases.rules]]
name = "run-path"
match_type = "regex"
pattern = "^runto\\s+(.+)$"
lua = "run_path"

[lua]
enabled = true
script_dir = "scripts"
entrypoint = "init.lua"
instruction_budget = 100000
max_actions_per_hook = 32
runtime_errors_to_output = true

[triggers]
enabled = true
max_commands_per_line = 8

# Example Lua trigger hooks from scripts/init.lua:
[[triggers.rules]]
name = "enemy-arrives-lua"
match_type = "regex"
pattern = "^(.+) arrives\\.$"
lua = "enemy_arrives"

[[triggers.rules]]
name = "room-header-memory"
match_type = "regex"
pattern = "^(.+)\\s+Exits are:"
lua = "remember_room"

[[triggers.rules]]
name = "needs-warning"
match_type = "regex"
pattern = "^You are (hungry|thirsty)\\."
lua = "needs_warning"

# Optional ANSI color filters:
# foreground = "lightred"
# background = "index:17"

[events]
enabled = true
max_dispatch_depth = 8
max_events_per_dispatch = 32
max_commands_per_dispatch = 16
history_limit = 100

[[events.handlers]]
name = "low-health-warning"
event = "LowHealth"
notification = "Low health event fired."
lua = "low_health"

[[events.handlers]]
name = "combat-started-lua"
match_type = "regex"
event = "^CombatStarted:(.+)$"
lua = "combat_started"

[[events.handlers]]
name = "route-requested-lua"
match_type = "regex"
event = "^RouteRequested:(.+)$"
lua = "route_requested"

[highlights]
enabled = true

[logging]
level = "mud_client=info"
raw_protocol = false
