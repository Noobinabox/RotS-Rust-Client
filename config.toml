  "CHARACTER_NAME",
  "RACE",
  "LEVEL",
  "HEALTH",
  "HEALTH_MAX",
  "MANA",
  "MANA_MAX",
  "MOVEMENT",
  "MOVEMENT_MAX",
  "EXPERIENCE",
  "EXPERIENCE_MAX",
  "OFFENSIVE_BONUS",
  "DODGE",
  "PARRY",
  "ATTACK_SPEED",
  "STR",
  "INT",
  "WILL",
  "DEX",
  "CON",
  "LEA",
  "WILLPOWER",
  "SPELL_SAVE",
  "SPIRIT",
  "SPELL_POWER",
  "SPELL_PEN",
  "OPPONENT_NAME",
  "OPPONENT_LEVEL",
  "OPPONENT_HEALTH",
  "OPPONENT_HEALTH_MAX",
  "ROOM",
  "ROOM_NAME",
  "ROOM_VNUM",
  "ROOM_EXITS",
  "WORLD_TIME",
  "WEATHER",
  "GROUP",
]

