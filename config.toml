spell_power = "SPELL_POWER"
spell_pen = "SPELL_PEN"
warrior_level = "WARRIOR_LEVEL"
ranger_level = "RANGER_LEVEL"
mystic_level = "MYSTIC_LEVEL"
mage_level = "MAGE_LEVEL"
