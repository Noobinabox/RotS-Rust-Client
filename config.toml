opponent_level = "OPPONENT_LEVEL"
room = "ROOM"
room_name = "ROOM_NAME"
room_vnum = "ROOM_VNUM"
room_exits = "ROOM_EXITS"
world_time = "WORLD_TIME"
weather = "WEATHER"
